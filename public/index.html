<script>
  // Send visitors to their language; Portuguese speakers get /pt/, everyone else /en/.
  var langs = navigator.languages || [navigator.language || ""];
  var pt = langs.some(function (l) { return /^pt\b/i.test(l); });
  location.replace((pt ? "/pt/" : "/en/") + location.hash);
</script>
